[tools]
"github:Goldziher/uncomment" = "3.7.0"
"aqua:go-task/task" = "3.53.1"
lefthook = "1.13.6"
"github:tessariq/taskrail" = "0.4.0"

[tasks.setup]
description = "Install pinned tools and opt-in Git hooks"
run = [
  "mise install",
  "lefthook install",
]

[tasks.check]
description = "Run policy, syntax, planning, and behavioral checks"
run = "mise exec -- task check"

[tasks.test]
description = "Run the real uncomment CLI against the comment-hygiene fixture"
run = "mise exec -- task test"

[tasks."workflow:status"]
description = "Show Taskrail work status"
run = "taskrail status"

[tasks."workflow:validate"]
description = "Validate Taskrail specifications and tasks"
run = "taskrail validate"

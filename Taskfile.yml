version: "3"

tasks:
  audit:
    desc: Preview ordinary comments that uncomment would remove; pass one or more paths after --
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/comment-hygiene audit {{.CLI_ARGS}}"

  audit-all:
    desc: Broaden the preview to documentation, TODO, and FIXME comments; still writes nothing
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/comment-hygiene audit --all {{.CLI_ARGS}}"

  strip:
    desc: Remove ordinary comments in place; pass one or more paths after --
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/comment-hygiene strip --apply {{.CLI_ARGS}}"

  strip-all:
    desc: Remove ordinary, documentation, TODO, and FIXME comments in place; requires review first
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/comment-hygiene strip --all --apply {{.CLI_ARGS}}"

  test:
    desc: Run behavior and repository-policy tests
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/test.sh"
      - "{{.TASKFILE_DIR}}/scripts/test-installed-runtime.sh"
      - "{{.TASKFILE_DIR}}/scripts/check-author-test.sh"
      - "{{.TASKFILE_DIR}}/scripts/check-commit-msg-test.sh"
      - "{{.TASKFILE_DIR}}/scripts/check-push-messages-test.sh"

  test:clean-install:
    desc: Verify public skill installations in isolated temporary targets
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/test-clean-install.sh"

  test:author:
    desc: Exercise the commit-author policy
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/check-author-test.sh"

  test:commit-msg:
    desc: Exercise the commit-message policy
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/check-commit-msg-test.sh"

  test:push-messages:
    desc: Exercise the pre-push history policy
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/check-push-messages-test.sh"

  check:
    desc: Check scripts, Taskrail state, policies, and behavior
    cmds:
      - "bash -n {{.TASKFILE_DIR}}/scripts/*.sh {{.TASKFILE_DIR}}/scripts/comment-hygiene"
      - taskrail validate
      - task test

  hooks:install:
    desc: Install opt-in Git hooks with Lefthook
    cmds:
      - lefthook install
